name: main-parking
services:
  db:
    image: postgres:17.6-alpine
    ports: ['127.0.0.1:5440:5432']
    environment:
      POSTGRES_DB: parking
      POSTGRES_USER: ${DB_USER:?Configure .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure .env}
    volumes:
      - parking-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d parking']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/parking
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8080
    depends_on: [backend]
    restart: unless-stopped
  proxy:
    image: nginx:1.28.0-alpine
    ports: ['3000:80', '127.0.0.1:8088:8088']
    volumes: ['./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [frontend, backend]
    restart: unless-stopped
volumes:
  parking-data:
