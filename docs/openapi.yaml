  "components": {
    "schemas": {
      "FieldError": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "field",
          "message"
        ],
        "properties": {
          "field": {
            "type": "string"
          },
          "message": {
            "type": "string"
          }
        }
      },
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "message",
          "fieldErrors",
          "traceId"
        ],
        "properties": {
          "code": {
            "type": "string",
            "enum": [
              "ALREADY_AUTHENTICATED",
              "ALREADY_INSIDE",
              "AUTH_REQUIRED",
              "BODY_TOO_LARGE",
              "CARD_BLOCKED",
              "CSRF_INVALID",
              "CURRENT_PASSWORD_INVALID",
              "DATABASE_UNAVAILABLE",
              "DEVICE_BOOT_NOT_REGISTERED",
              "DEVICE_DISABLED",
              "DEVICE_RATE_LIMITED",
              "DEVICE_UNAUTHORIZED",
              "ENABLED_CARD_EXISTS",
              "FORBIDDEN",
              "IDEMPOTENCY_CONFLICT",
              "INVALID_CREDENTIALS",
              "INVALID_SESSION_STATE",
              "INVALID_SIGNATURE",
              "LOGIN_RATE_LIMITED",
              "NOT_FOUND",
              "ORDER_IN_PROGRESS",
              "PACKAGE_DISABLED",
              "PAYMENT_CONSISTENCY_ERROR",
              "PAYMENT_MODE_MISMATCH",
              "PAYMENT_PROVIDER_UNAVAILABLE",
              "PROVIDER_MISMATCH",
              "RECONCILE_RATE_LIMITED",
              "REGISTRATION_RATE_LIMITED",
              "SESSION_CAPACITY_CONFLICT",
              "SESSION_INVALID",
              "UID_TAKEN",
              "USERNAME_TAKEN",
              "USER_DISABLED",
              "VALIDATION_ERROR"
            ]
          },
          "message": {
            "type": "string"
          },
          "fieldErrors": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/FieldError"
            }
          },
          "traceId": {
            "type": "string"
          },
          "orderId": {
            "type": "string",
            "format": "uuid",
            "description": "Existing order for ORDER_IN_PROGRESS; only returned within authorized ownership."
          }
        }
      },
      "UserView": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "username",
          "fullName",
