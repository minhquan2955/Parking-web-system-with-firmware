server {
    listen 80;
    server_tokens off;
    client_max_body_size 64k;
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Overwrite rather than append untrusted client forwarded headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
# A payment tunnel MUST target only this listener (host loopback:8088).
server {
    listen 8088;
    server_tokens off;
    client_max_body_size 256k;
    location = /api/v1/payments/webhooks/payos {
        limit_except POST { deny all; }
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
    }
    location / { return 404; }
}
