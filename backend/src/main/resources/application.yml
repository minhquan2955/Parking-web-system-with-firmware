spring:
  application:
    name: parking-api
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/parking}
    username: ${DB_USER:parking}
    password: ${DB_PASSWORD:}
    hikari:
      connection-init-sql: SET lock_timeout = '5s'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: 8080
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
management:
  server:
    port: 8081
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
parking:
  payment-mode: ${PAYMENT_MODE:mock}
  admin-username: ${ADMIN_USERNAME:}
  admin-password: ${ADMIN_PASSWORD:}
  device-key: ${DEVICE_KEY:}
  public-url: ${PUBLIC_URL:http://localhost:3000}
  trusted-proxy: ${TRUSTED_PROXY:}
  payos-client-id: ${PAYOS_CLIENT_ID:}
  payos-api-key: ${PAYOS_API_KEY:}
  payos-checksum-key: ${PAYOS_CHECKSUM_KEY:}
  payos-timezone: ${PAYOS_TIMEZONE:}
